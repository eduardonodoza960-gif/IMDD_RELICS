name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descompactar o zip do mod
        run: |
          mkdir -p modsrc
          # se houver mais de um .zip no repo, usa o enviado mais recentemente
          ZIP=$(for f in ./*.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -n 1 | cut -d' ' -f2-)
          echo "Usando zip: $ZIP"
          unzip -q "$ZIP" -d modsrc
          # acha a pasta onde esta o build.gradle (mesmo se o zip tiver pasta extra)
          DIR=$(dirname "$(find modsrc -name build.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "MOD_DIR=$DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $DIR"

      - name: Corrigir import errado (Formatting)
        run: |
          grep -rl "net.minecraft.text.Formatting" "$MOD_DIR/src" | xargs -r sed -i 's/net\.minecraft\.text\.Formatting/net.minecraft.util.Formatting/g'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build with Gradle
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: imdd-reliquias-1.21.4
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
